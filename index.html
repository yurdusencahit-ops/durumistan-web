<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dürümistan - Geleneksel Lezzet Durağı</title>
<style>
:root {
--bg-color: #121212;
--card-bg: rgba(30, 30, 30, 0.7);
--accent-color: #f4a261;
--text-color: #fefae0;
}
body { font-family: sans-serif; color: var(--text-color); margin: 0; padding: 0; }

/* Arka Plan Slider */
.bg-slider { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; overflow: hidden; }
.bg-slide {
position: absolute; width: 100%; height: 100%; background-size: cover; background-position: center;
opacity: 0; transition: opacity 2s ease-in-out;
}
.bg-slide.active { opacity: 0.8; } /* Opaklığı artırdık ki resim net görünsün */

/* Örtücü katmanı hafiflettik ki resim parlasın */
.bg-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.3);
z-index: -1;
}

.container { max-width: 900px; margin: 40px auto; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 15px; }
.music-control { position: fixed; top: 20px; right: 20px; z-index: 1000; padding: 10px; cursor: pointer; }
h1 { text-align: center; color: var(--accent-color); font-size: 3rem; text-shadow: 2px 2px 5px #000; }
.menu-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #555; padding: 10px 0; }
.price { color: var(--accent-color); font-weight: bold; }
</style>
</head>
<body>

<div class="bg-slider">
<div class="bg-slide active" style="background-image: url('https://images.unsplash.com/photo-1555939594-58d7cb561ad1?auto=format&fit=crop&w=1600&q=80');"></div>
<div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=1600&q=80');"></div>
<div class="bg-slide" style="background-image: url('https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?auto=format&fit=crop&w=1600&q=80');"></div>
</div>
<div class="bg-overlay"></div>

<button class="music-control" onclick="document.getElementById('bgMusic').play()">🎵 Müziği Aç</button>
<audio id="bgMusic" loop><source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3" type="audio/mpeg"></audio>

<div class="container">
<h1>DÜRÜMİSTAN</h1>
<div class="menu-item"><span>Adana Dürüm</span><span class="price">350 TL</span></div>
<div class="menu-item"><span>Urfa Dürüm</span><span class="price">350 TL</span></div>
<div class="menu-item"><span>Tavuk Dürüm</span><span class="price">300 TL</span></div>
</div>

<script>
let slides = document.querySelectorAll('.bg-slide');
let i = 0;
setInterval(() => {
slides[i].classList.remove('active');
i = (i + 1) % slides.length;
slides[i].classList.add('active');
}, 5000);
</script>
</body>
</html>
